<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  <link rel="icon" type="image/png" href="https://res.cloudinary.com/dl8f1ztsy/image/upload/v1767531209/Lock_no_bg_b8rp0v.png" sizes="48x48" />
  <link rel="apple-touch-icon" href="https://res.cloudinary.com/dl8f1ztsy/image/upload/v1767531209/Lock_no_bg_b8rp0v.png" />
  <link rel="preload" href="https://res.cloudinary.com/dl8f1ztsy/image/upload/v1767533735/SSN_FULL_LOGOHE_mesdpk.png" as="image" type="image/png" />
  <title>SSN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Space Grotesk', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            background: 'hsl(210, 10%, 11%)',
            foreground: 'hsl(225, 5%, 80%)',
            primary: 'hsl(267, 100%, 64%)', // Solana Purple
            secondary: 'hsl(155, 89%, 51%)', // Solana Green
            card: 'hsl(210, 10%, 13%)',
            destructive: 'hsl(0, 84%, 60%)',
            border: 'hsl(210, 10%, 18%)',
          },
          animation: {
            'fade-in': 'fadeIn 0.3s ease-out forwards',
            'slide-up': 'slideUp 0.4s ease-out forwards',
            'shimmer': 'shimmer 1.5s infinite',
            'pulse-slow': 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'text-wave': 'textWave 4s ease-in-out infinite',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            shimmer: {
              '0%': { backgroundPosition: '-200% 0' },
              '100%': { backgroundPosition: '200% 0' },
            },
            textWave: {
              '0%': { backgroundPosition: '200% center' },
              '100%': { backgroundPosition: '-200% center' },
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: hsl(210, 10%, 11%);
      color: hsl(225, 5%, 80%);
      -webkit-font-smoothing: antialiased;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Utility for hiding scrollbar but keeping functionality */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      /* IE and Edge */
      scrollbar-width: none;
      /* Firefox */
    }

    .safe-area-pb {
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* Text wave animation */
    .text-wave-effect {
      background: linear-gradient(90deg,
          #ffffff 0%,
          #ffffff 30%,
          #9945FF 45%,
          #14F195 50%,
          #9945FF 55%,
          #ffffff 70%,
          #ffffff 100%);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: textWave 7s ease-in-out infinite;
    }

    @keyframes textWave {
      0% {
        background-position: 200% center;
      }

      100% {
        background-position: -200% center;
      }
    }

    /* Wallet adapter button rounded corners - override all wallet adapter styles */
    /* Works on both desktop and mobile */
    .wallet-button-rounded,
    .wallet-button-rounded *,
    .wallet-button-rounded button,
    .wallet-button-rounded .wallet-adapter-button,
    .wallet-adapter-button-trigger.wallet-button-rounded button,
    .wallet-adapter-button-trigger.wallet-button-rounded .wallet-adapter-button,
    .wallet-adapter-button-trigger.wallet-button-rounded > *,
    .wallet-adapter-button-trigger.wallet-button-rounded > button,
    .wallet-adapter-button-trigger.wallet-button-rounded button.wallet-adapter-button,
    .wallet-adapter-button-trigger.wallet-button-rounded .wallet-adapter-button-trigger,
    .wallet-adapter-button-trigger.wallet-button-rounded .wallet-adapter-dropdown button {
      border-radius: 9999px !important;
      -webkit-border-radius: 9999px !important;
      -moz-border-radius: 9999px !important;
    }
    
    /* Force rounded corners on all child elements and nested structures - mobile and desktop */
    .wallet-button-rounded button,
    .wallet-button-rounded .wallet-adapter-button,
    .wallet-button-rounded [class*="wallet"],
    .wallet-button-rounded [class*="button"],
    .wallet-button-rounded button[class*="wallet"],
    .wallet-button-rounded button[class*="button"],
    .wallet-button-rounded .wallet-adapter-dropdown button,
    .wallet-button-rounded .wallet-adapter-dropdown .wallet-adapter-button {
      border-radius: 9999px !important;
      border-top-left-radius: 9999px !important;
      border-top-right-radius: 9999px !important;
      border-bottom-left-radius: 9999px !important;
      border-bottom-right-radius: 9999px !important;
      -webkit-border-radius: 9999px !important;
      -moz-border-radius: 9999px !important;
    }
    
    /* Target any element inside wallet-button-rounded - including mobile */
    .wallet-button-rounded * {
      border-radius: inherit !important;
    }
    
    /* Mobile-specific overrides to ensure rounded corners */
    @media (max-width: 768px) {
      .wallet-button-rounded,
      .wallet-button-rounded button,
      .wallet-button-rounded .wallet-adapter-button,
      .wallet-adapter-button-trigger.wallet-button-rounded button,
      .wallet-adapter-button-trigger.wallet-button-rounded .wallet-adapter-button {
        border-radius: 9999px !important;
        -webkit-border-radius: 9999px !important;
        -moz-border-radius: 9999px !important;
      }
    }
  </style>

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
